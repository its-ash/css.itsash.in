  'typographic': ['#1A1A1A','#2C2C2C','#444444','#666666','#8B0000','#003366','#1B4332','#4A0E4E','#800020','#0B3954','#6B2D5C','#1A5E3F','#3E1F47','#0D1B2A','#1B263C','#2B2D42'],
  'minimalism-mono': ['#1A1A1A','#2C2C2C','#444444','#666666','#888888','#AAAAAA','#CCCCCC','#EEEEEE','#5C5C5C','#3D3D3D','#707070','#505050','#606060','#909090','#B0B0B0','#D0D0D0'],
  'papercut': ['#E07A5F','#3D405B','#81B29A','#F2CC8F','#F4F1DE','#264653','#2A9D8F','#E9C46A','#F4A261','#E76F51','#B5838D','#6D6875','#A4243B','#D8973C','#264E36','#5B2A86'],
  'skeuomorphism-classic': ['#5C6BC0','#66BB6A','#FFA726','#42A5F5','#AB47BC','#26A69A','#FFCA28','#EF5350','#78909C','#8D6E63','#9CCC65','#5DD9C3','#E8A0BF','#B39DDB','#7E57C2','#26C6DA'],
};
let PRESETS = STYLE_PRESETS['default'];

let currentTheme = null;
let previewReady = false;
let pendingTheme = null;
const previewFrame = $('preview');

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'preview-ready') {
    previewReady = true;
    if (pendingTheme) sendToPreview(pendingTheme);
  }
});

function setStatus(msg, ms = 2000) {
  $('status').textContent = msg;
  clearTimeout(setStatus._t);
  setStatus._t = setTimeout(() => $('status').textContent = 'Ready', ms);
}

function renderPresets() {
  const grid = $('presets');
  const styleId = $('style-select').value || 'default';
  PRESETS = STYLE_PRESETS[styleId] || STYLE_PRESETS['default'];
  grid.innerHTML = PRESETS.map(c => `<div class="preset" data-color="${c}" style="background:${c}" title="${c}"></div>`).join('');
  grid.querySelectorAll('.preset').forEach(el => {
    el.addEventListener('click', () => {
      const c = el.dataset.color;
      $('color-input').value = c;
      $('color-picker').value = c.toLowerCase();
      grid.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      run();
    });
  });
}

function renderFontPickers() {
  const allFonts = [...new Set(FONTS.map(f => f.name))];
  const headingSel = $('heading-font');
  headingSel.innerHTML = allFonts.map(f => `<option value="${f}">${f}</option>`).join('');
  headingSel.value = 'Inter';
  const styleSel = $('style-select');
  styleSel.innerHTML = STYLE_IDS.map(id => `<option value="${id}">${STYLE_LABELS[id]}</option>`).join('');
  styleSel.value = 'default';
}

function autoFonts() {
  const heading = $('heading-font').value;
  const styleId = $('style-select').value || 'default';
  const body = autoPairForStyle(heading, styleId);
  const mono = autoMonoForStyle(heading, body, styleId);
  $('auto-fonts-info').innerHTML =
    `<div style="margin-bottom:.3rem"><span style="color:var(--app-text)">Body:</span> ${body}</div>` +
    `<div><span style="color:var(--app-text)">Mono:</span> ${mono}</div>`;
  return { heading, body, mono };
}

function colorRow(name, hex, oklch) {
  return `<div class="color-row">
    <div class="swatch" style="background:${hex}"></div>
    <div class="color-info">
      <span class="color-info-name">${name}</span>
      <span class="color-info-value">${hex} · ${oklch}</span>
    </div>
  </div>`;
}

function renderCore(core) {
  $('core-colors').innerHTML =
    colorRow('Primary', core.primary, core.primaryOklch) +
    colorRow('Accent', core.accent, core.accentOklch) +
    colorRow('Neutral', core.neutral, core.neutralOklch) +
    colorRow('Contrast', core.contrast, core.contrastOklch);
}

function renderRatios(ratios) {
  $('ratios').innerHTML = ratios.map(r => {
    const cls = r.ratio >= 4.5 ? 'pass' : (r.ratio >= 3 ? 'pass' : 'fail');
    return `<div class="ratio-item"><span>${r.name}</span><span class="${cls}">${r.ratio}:1</span></div>`;
  }).join('');
}

function run() {
  const input = $('color-input').value.trim();
  const fontConfig = autoFonts();
  const styleId = $('style-select').value || 'default';
  const result = generateTheme(input, fontConfig, styleId);
  if (result.error) {
    $('color-input').classList.add('invalid');
    setStatus('Error: ' + result.error);
    return;
  }
  $('color-input').classList.remove('invalid');
  currentTheme = result;
  renderCore(result.core);
  renderRatios(result.ratios);
  $('font-info').innerHTML =
    `<div style="margin-bottom:.4rem"><span style="color:var(--app-text)">Headings:</span> ${result.fonts.heading}</div>` +
    `<div style="margin-bottom:.4rem"><span style="color:var(--app-text)">Body:</span> ${result.fonts.body}</div>` +
    `<div><span style="color:var(--app-text)">Mono:</span> ${result.fonts.mono}</div>`;

  const payload = { css: result.css, url: result.fontUrl, core: result.core };
  pendingTheme = payload;
  sendToPreview(payload);
  if (!previewReady) setTimeout(() => sendToPreview(payload), 600);

  $('css-output').textContent = result.css;
  updateHtmlOutput();
  const embedUrl = `https://css.itsash.in/js/theme-loader.js?color=${encodeURIComponent($('color-input').value)}&heading=${encodeURIComponent(fontConfig.heading)}&style=${encodeURIComponent(styleId)}`;
  $('header-embed-code').textContent = `<script src="${embedUrl}"><\/script>`;
  const params = new URLSearchParams();
  params.set('color', $('color-input').value);
  params.set('heading', fontConfig.heading);
  params.set('style', styleId);
  const newUrl = `${location.pathname}?${params.toString()}`;
  history.replaceState(null, '', newUrl);
  setStatus('Theme generated');
}

function sendToPreview(payload) {
  const w = previewFrame.contentWindow;
  if (!w) return;
  w.postMessage({ type: 'theme-css', css: payload.css }, '*');
  w.postMessage({ type: 'theme-fonts', url: payload.url }, '*');
  w.postMessage({ type: 'theme-core', core: payload.core }, '*');
}

async function updateHtmlOutput() {
  if (!currentTheme) return;
  const resp = await fetch('preview.html');
  const html = await resp.text();
  const fontUrl = currentTheme.fontUrl;
  const fontLink = fontUrl
    ? `<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="${fontUrl}" rel="stylesheet">`
    : '';
  const full = html.replace('<style id="theme-css"></style>', `${fontLink}<style id="theme-css">${currentTheme.css}</style>`);
  $('html-output').textContent = full;
}

previewFrame.addEventListener('load', () => {
  previewReady = true;
  if (pendingTheme) sendToPreview(pendingTheme);
});

function setupTabs() {
  document.querySelectorAll('.app-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      document.querySelectorAll('.app-tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === target));
    });
  });
}

function setupInputs() {
  $('color-input').addEventListener('keydown', e => { if (e.key === 'Enter') run() });
  $('color-picker').addEventListener('input', e => {
    $('color-input').value = e.target.value.toUpperCase();
    run();
  });
  $('generate').addEventListener('click', run);
  $('heading-font').addEventListener('change', run);
  $('style-select').addEventListener('change', () => { renderPresets(); run(); });
  $('copy-embed').addEventListener('click', async () => {
    await navigator.clipboard.writeText($('header-embed-code').textContent);
    setStatus('Embed code copied');
  });
  $('copy-css').addEventListener('click', async () => {
    if (!currentTheme) return;
    await navigator.clipboard.writeText(currentTheme.css);
    setStatus('CSS copied');
  });
  $('copy-html').addEventListener('click', async () => {
    if (!currentTheme) return;
    const resp = await fetch('preview.html');
    const html = await resp.text();
    const css = currentTheme.css;
    const fontUrl = currentTheme.fontUrl;
    const fontLink = fontUrl
      ? `<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="${fontUrl}" rel="stylesheet">`
      : '';
    const full = html.replace('<style id="theme-css"></style>', `${fontLink}<style id="theme-css">${css}</style>`);
    await navigator.clipboard.writeText(full);
    setStatus('HTML copied');
  });
  $('download').addEventListener('click', () => {
    if (!currentTheme) return;
    const css = new Blob([currentTheme.css], { type: 'text/css' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(css);
    a.download = 'theme.css';
    a.click();
    setStatus('Downloaded');
  });
}

function syncFromUrl() {
  const params = new URLSearchParams(location.search);
  const color = params.get('color');
  const heading = params.get('heading');
  const style = params.get('style');
  if (color) { $('color-input').value = color; $('color-picker').value = color.toLowerCase(); }
  if (heading && FONTS.find(f => f.name === heading)) $('heading-font').value = heading;
  if (style && STYLE_IDS.includes(style)) $('style-select').value = style;
}

renderPresets();
renderFontPickers();
setupTabs();
setupInputs();
syncFromUrl();
renderPresets();
run();
</script>
</body>
</html>
